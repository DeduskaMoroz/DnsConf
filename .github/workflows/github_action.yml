name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '30 1 * * *' # Каждую ночь ровно в 04:30 по МСК (01:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

# Two runs at once read and write the same dns profile, so a new run replaces the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: "http://localhost:8000/smart_hosts.txt"
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ""

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Generate Smart Hosts (Stress Test & Priority Sort)
        run: |
          python3 smart_hosts.py
          nohup python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2

      - name: Run application
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar

      - name: Keep repository active (Prevent 60-day GitHub cron disable)
        continue-on-error: true
        run: |
          date -u +"Last automated DNS update: %Y-%m-%d %H:%M:%S UTC" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: automated keepalive update" || true
          git push || true
